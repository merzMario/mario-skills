name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate marketplace manifest and skill frontmatter
        run: npm run validate
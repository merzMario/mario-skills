# diary-writer 完整配置示例
# --------------------------------
# Copy to ~/.config/diary-obsidian/config.ini  (or set DIARY_CONFIG=/path/to/this)
# Run `bash scripts/diary_write.sh --init` to generate one interactively.

# [必填] Vault / 目录。
# macOS + iCloud Obsidian 通常长这样：
# VAULT_DIR=/Users/you/Library/Mobile Documents/iCloud~md~obsidian/Documents/Obsidian
# Linux + 标准目录：
# VAULT_DIR=/home/you/Documents/Obsidian
# Windows + WSL:
# VAULT_DIR=/mnt/c/Users/you/Documents/Obsidian
VAULT_DIR=/Users/you/Documents/Obsidian

# [可选, 默认 journals] 相对 VAULT_DIR 的日记子目录。
# 想跟 CLAUDE.md 那种 "00-Raw/journals" 风格对齐就写 00-Raw/journals。
# 想干净分层就写 journals 或 diary。
JOURNALS_SUBDIR=journals

# [可选, 默认 $XDG_DATA_HOME/diary-obsidian]
# 脚本运行时需要的 hash / log / backup 都堆在这里：
#   $STATE_DIR/hashes/YYYY-MM-DD.hash      # 每条已写内容的去重指纹
#   $STATE_DIR/logs/diary-write.log       # 写入日志
#   $STATE_DIR/backups/diary-backup-*.md  # 追加前的快照（按需清理）
#
# 不想用 XDG 路径就写绝对路径。带 ~ 也行（脚本会展开）。
STATE_DIR=/Users/you/.local/share/diary-obsidian

# [可选, 默认 日记,复盘] 新建日记文件时 frontmatter 的 tags 列表。逗号分隔。
# 留空（清空这一行）= 不写 tags 字段。
# 例：TEMPLATE_TAGS=diary,journal
# 例：TEMPLATE_TAGS=
TEMPLATE_TAGS=日记,复盘

# ----- 未识别 keys -----
# 脚本遇到未识别的 KEY 会忽略不报错。新版本加了新选项不会弄坏老 config。
# diary-writer minimum config — copy to ~/.config/diary-obsidian/config.ini
# (or set DIARY_CONFIG=/path/to/this/file)
#
# Only VAULT_DIR is required; the rest fall back to:
#   JOURNALS_SUBDIR  = journals
#   STATE_DIR        = $XDG_DATA_HOME/diary-obsidian  (default ~/.local/share/diary-obsidian)
#   TEMPLATE_TAGS    = 日记,复盘
#
# Generated by --init on first run; this file is hand-written fallback.

VAULT_DIR=/Users/you/Documents/Obsidian
JOURNALS_SUBDIR=journals
STATE_DIR=/Users/you/.local/share/diary-obsidian
TEMPLATE_TAGS=日记,复盘